[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-from-scratch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["tiktoken", "requests", "python-dotenv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]